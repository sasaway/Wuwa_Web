<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명조 웹툴 스위트</title>
<style>
  :root{
    --bg:#0f1420;
    --panel:#161d2e;
    --panel2:#1c2438;
    --border:#2a3350;
    --text:#e8e6df;
    --muted:#8b93a7;
    --gold:#d4af6a;
    --gold-dim:#a68a52;
    --first:#4a90d9;
    --auto:#9b6fd1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(212,175,106,0.08), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(74,144,217,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  main{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    text-align:center;
    color:var(--gold);
    font-size:12.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:700;
  }
  h1{
    text-align:center;
    font-size:26px;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:0 0 40px;
  }
  .cards{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  a.tile{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 22px;
    text-decoration:none;
    color:var(--text);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  a.tile::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:var(--accent, var(--gold));
  }
  a.tile:hover{
    transform:translateY(-2px);
    border-color:var(--accent, var(--gold-dim));
    background:var(--panel2);
  }
  .tile-icon{
    width:48px;
    height:48px;
    flex:0 0 auto;
    border-radius:10px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    border:1px solid var(--border);
  }
  .tile-body{flex:1;min-width:0;}
  .tile-title{
    font-size:16.5px;
    font-weight:700;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tile-title .tag{
    font-size:10.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:rgba(255,255,255,0.06);
    color:var(--accent, var(--gold));
    border:1px solid var(--border);
  }
  .tile-desc{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .tile-arrow{
    color:var(--muted);
    font-size:18px;
    flex:0 0 auto;
  }
  .tile.gacha{--accent:var(--first);}
  .tile.calc{--accent:var(--auto);}
  footer{
    text-align:center;
    margin-top:36px;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
  }
  footer a{color:var(--muted);}
  @media (max-width:420px){
    a.tile{padding:16px;gap:12px;}
    .tile-icon{width:40px;height:40px;font-size:18px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Wuthering Waves · Unofficial Tools</div>
  <h1>명조 웹툴 스위트</h1>
  <p class="tagline">가챠 계획부터 육성 재화 계산까지, 필요한 것만 모아둔 개인용 도구 모음</p>

  <div class="cards">
    <a class="tile gacha" href="./gacha/">
      <div class="tile-icon">🌌</div>
      <div class="tile-body">
        <div class="tile-title">가챠 계획 시뮬레이터 <span class="tag">Planner</span></div>
        <div class="tile-desc">보유·수급 재화로 다음 픽업까지 희망편/절망편 뽑기가 가능한지 계산하고, 일정·과금 내역을 관리합니다.</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>

    <a class="tile calc" href="./calculator/">
      <div class="tile-icon">🧮</div>
      <div class="tile-body">
        <div class="tile-title">스킬 재화 계산기 <span class="tag">Calculator</span></div>
        <div class="tile-desc">캐릭터 스킬 레벨업에 필요한 재화를 티어별로 합산하고, 육성 파티 단위로 정리합니다.</div>
      </div>
      <div class="tile-arrow">›</div>
    </a>
  </div>

  <footer>
    개인 제작 비공식 도구 · 명조(Wuthering Waves)는 Kuro Games의 상표입니다.
  </footer>
</main>
</body>
</html>
