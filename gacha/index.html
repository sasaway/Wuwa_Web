<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명조 가챠 계획 시뮬레이터</title>
<style>
  :root{
    --bg:#0f1420;
    --panel:#161d2e;
    --panel2:#1c2438;
    --border:#2a3350;
    --text:#e8e6df;
    --muted:#8b93a7;
    --gold:#d4af6a;
    --gold-dim:#a68a52;
    --first:#4a90d9;
    --second:#e0954e;
    --auto:#9b6fd1;
    --monthly:#4fae7a;
    --endcontent:#d968a0;
    --danger:#d9534f;
    --danger-dim:#8a3a37;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;
    font-size:14px;
    line-height:1.5;
    padding-bottom:70px;
  }
  header{
    padding:16px 16px 0;
    max-width:960px;
    margin:0 auto;
  }
  h1{
    font-size:18px;
    color:var(--gold);
    margin:0 0 12px;
    font-weight:700;
  }
  nav.tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
  }
  nav.tabs button{
    background:none;
    border:none;
    color:var(--muted);
    padding:10px 14px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{
    color:var(--gold);
    border-bottom-color:var(--gold);
    font-weight:600;
  }
  main{
    max-width:960px;
    margin:0 auto;
    padding:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 10px;
    color:var(--text);
  }
  .half-header{
    padding:8px 12px;
    border-radius:6px;
    font-weight:700;
    font-size:13px;
    margin:18px 0 10px;
    color:#0f1420;
  }
  .half-header:first-child{margin-top:0;}
  .half-header.first{background:var(--first);}
  .half-header.second{background:var(--second);}
  .half-header.auto{background:var(--auto);}
  .half-header.monthly{background:var(--monthly);}
  .half-header.endcontent{background:var(--endcontent);}
  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin:14px 0 6px;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){
    .grid2{grid-template-columns:1fr;}
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  th,td{
    padding:6px 6px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  th{color:var(--muted);font-weight:600;}
  td input[type=text],td input[type=number],td input[type=date]{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:4px;
    padding:4px 6px;
    font-size:12.5px;
  }
  input[type=date]{color-scheme:dark;}
  select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:4px;
    padding:4px 6px;
    font-size:12.5px;
  }
  .table-scroll{overflow-x:auto;}
  .row-acquired{
    background:rgba(79,174,122,0.08);
    color:var(--muted);
  }
  .row-acquired td:first-child::after{
    content:" ✓";
    color:var(--monthly);
    font-weight:700;
  }

    font-size:12px;
    color:var(--muted);
    margin-top:6px;

    color:var(--text);

    border-radius:6px;
    cursor:pointer;
    font-size:12.5px;

    border:none;
    font-weight:700;

    padding:12px;
    margin-bottom:10px;

  .banner.despair{background:rgba(217,83,79,0.15);border:1px solid var(--danger);}

  .surplus-pos{color:var(--monthly);}
  .surplus-neg{color:var(--danger);}

    background:var(--panel);
    border-top:1px solid var(--border);

    display:flex;
    justify-content:center;
  }

  .cal-nav span{font-weight:700;color:var(--gold);}
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);

  }

    font-size:10.5px;

    height:5px;

    margin-top:2px;

    margin-top:2px;

  .note{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .toast{

    background:var(--panel2);border:1px solid var(--gold-dim);
    color:var(--text);padding:8px 14px;border-radius:6px;
    font-size:12.5px;opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;}
  .empty-hint{color:var(--muted);font-size:12px;padding:8px 0;}

function charPullsDespair(chain){ return (1 + Number(chain||0)) * 2 * PULLS_PER_5STAR; }

/* =========================================================
   상태 / 저장
========================================================= */
const STORAGE_KEYS = ['dailyWeekly','miscIncome','eventIncome','spendings','versions','holdings','currentStatus','bannerSchedule'];

let state = {
  dailyWeekly: defaultDailyWeekly(),
  miscIncome: defaultMiscIncome(),
  eventIncome: defaultEventIncome(),
  spendings: defaultSpendings(),
  versions: defaultVersions(),
  holdings: defaultHoldings(),
  currentStatus: defaultCurrentStatus(),
  bannerSchedule: defaultBannerSchedule(),
  toaSeasons: FALLBACK_TOA_SEASONS.slice(),
  whiwaSeasons: FALLBACK_WHIWA_SEASONS.slice(),
};

let loaded = false;
const saveTimers = {};

/* window.storage는 Claude 아티팩트 미리보기 전용 API — GitHub Pages 등 일반 배포 환경에는 없음.
   있으면 window.storage를, 없으면 localStorage를 자동으로 쓰도록 어댑터로 감싸서
   "미리보기에서 개발 → 그대로 배포"가 코드 수정 없이 되도록 함. */
const hasArtifactStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const storageAdapter = hasArtifactStorage ? {
  get: (key) => window.storage.get(key, false),
  set: (key, value) => window.storage.set(key, value, false),
} : {
  get: async (key) => {
    const v = localStorage.getItem('wuwa_gacha_' + key);
    return v == null ? null : {value: v};
  },
  set: async (key, value) => {
    localStorage.setItem('wuwa_gacha_' + key, value);
    return {value};
  },
};

async function loadKey(key, fallback){
  try{
    const res = await storageAdapter.get(key);
    if(res && typeof res.value === 'string'){
      return JSON.parse(res.value);
    }
    return fallback;
  }catch(e){
    return fallback;
  }
}

async function loadAll(){
  const defaults = {
    dailyWeekly: defaultDailyWeekly(),
    miscIncome: defaultMiscIncome(),
    eventIncome: defaultEventIncome(),
    spendings: defaultSpendings(),
    versions: defaultVersions(),
    holdings: defaultHoldings(),
    currentStatus: defaultCurrentStatus(),
    bannerSchedule: defaultBannerSchedule(),
  };
  for(const key of STORAGE_KEYS){
    state[key] = normalize(key, await loadKey(key, defaults[key]));
  }
  loaded = true;
}

/* 구버전 데이터 마이그레이션 자리 — 스키마 바뀔 때마다 여기서 보정 */
function normalize(key, value){
  if(value == null) return value;
  if(key === 'holdings'){
    return {star:Number(value.star||0), char:Number(value.char||0), weapon:Number(value.weapon||0)};
  }
  return value;
}

/* 초기 로드는 loadAll()에서 직접 state에 대입하므로 burst-save 문제가 애초에 발생하지 않음
   (React 버전의 justLoadedRef 가드는 "로드"와 "저장 트리거"가 같은 훅 경로를 타서 필요했던 것.
    여기서는 scheduleSave가 사용자 조작 함수에서만 호출되므로 별도 가드가 불필요함) */
function scheduleSave(key){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{
      await storageAdapter.set(key, JSON.stringify(state[key]));
    }catch(e){
      showToast('저장 실패: ' + key);
    }
  }, 500);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* =========================================================
   숫자 입력 헬퍼 (0-프리픽스 버그 방지)
========================================================= */
function numDisplay(n){ return (!n) ? '' : String(n); }
function parseNum(v){ const n = parseInt(v,10); return isNaN(n) ? 0 : n; }

/* =========================================================
   2단 클릭 확인 (confirm() 미사용)
========================================================= */
function armedClick(btn, originalLabel, onConfirm){
  if(btn.dataset.armed === '1'){
    clearTimeout(Number(btn.dataset.timer));
    btn.dataset.armed = '0';
    btn.textContent = originalLabel;
    onConfirm();
  }else{
    btn.dataset.armed = '1';
    btn.textContent = '한번 더 클릭';
    const t = setTimeout(()=>{
      btn.dataset.armed = '0';
      btn.textContent = originalLabel;
    }, 4000);
    btn.dataset.timer = String(t);
  }
}

/* =========================================================
   집계 로직
========================================================= */
function sumIncome(){
  const total = {star:0, char:0, weapon:0};
  const addItem = (it)=>{
    if(it.acquired) return;
    total.star += Number(it.star||0);
    total.char += Number(it.char||0);
    total.weapon += Number(it.weapon||0);
  };
  state.dailyWeekly.forEach(addItem);
  state.miscIncome.forEach(addItem); // 매트릭스 포함 — group과 무관하게 전부 합산
  state.eventIncome.forEach(addItem);
  state.spendings.forEach(it=>{
    if(it.acquired) return;
    if(it.mode === 'split'){
      total.star += Number(it.firstStar||0) + Number(it.secondStar||0);
      total.char += Number(it.firstChar||0) + Number(it.secondChar||0);
      total.weapon += Number(it.firstWeapon||0) + Number(it.secondWeapon||0);
    }else{
      total.star += Number(it.star||0);
      total.char += Number(it.char||0);
      total.weapon += Number(it.weapon||0);
    }
  });
  return total;
}

function getNextBanner(){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = (state.bannerSchedule||[])
    .filter(b => b.start && new Date(b.start) >= today)
    .sort((a,b)=> new Date(a.start) - new Date(b.start));
  return upcoming[0] || null;
}

function countResetsBetween(seasons, from, to){
  return (seasons||[]).filter(s=>{
    if(!s.start) return false;
    const d = new Date(s.start);
    return d > from && d <= to;
  }).length;
}

function endContentBonusStar(){
  const nb = getNextBanner();
  if(!nb || nb.half !== 'first') return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(nb.start);
  const toaCount = countResetsBetween(state.toaSeasons, today, target);
  const whiwaCount = countResetsBetween(state.whiwaSeasons, today, target);
  return (toaCount + whiwaCount) * 800;
}

function computeMainResult(){
  const version = state.versions[0];
  let hopeCharPulls = 0, despairCharPulls = 0, weaponPullsTotal = 0;
  (version ? version.characters : []).forEach(c=>{
    hopeCharPulls += charPullsHope(c.chain);
    despairCharPulls += charPullsDespair(c.chain);
    if(c.hasWeapon) weaponPullsTotal += WEAPON_EXPECTED_PULLS;
  });

  const income = sumIncome();
  const availableCharTickets = Number(state.holdings.char||0) + income.char;
  const availableWeaponTickets = Number(state.holdings.weapon||0) + income.weapon;
  const bonus = endContentBonusStar();
  const availableStar = Number(state.holdings.star||0) + income.star + bonus;

  const neededCharStarHope = Math.max(0, hopeCharPulls - availableCharTickets) * PULL_COST;
  const neededCharStarDespair = Math.max(0, despairCharPulls - availableCharTickets) * PULL_COST;
  const neededWeaponStar = Math.max(0, weaponPullsTotal - availableWeaponTickets) * PULL_COST;

  return {
    hopeCharPulls, despairCharPulls, weaponPullsTotal,
    availableCharTickets, availableWeaponTickets, availableStar, bonus,
    surplusHope: availableStar - (neededCharStarHope + neededWeaponStar),
    surplusDespair: availableStar - (neededCharStarDespair + neededWeaponStar),
    neededWeaponStar,
  };
}

let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed

function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startWeekday = first.getDay();
  const days = new Date(calYear, calMonth+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const markFor = (d)=>{
    if(!d) return '';
    let html = '';
    state.toaSeasons.forEach(s=>{
      if(isSameYMD(s.start,d)) html += `<div class="cal-bar toa" title="역경의 탑 초기화"></div>`;
    });
    state.whiwaSeasons.forEach(s=>{
      if(isSameYMD(s.start,d)) html += `<div class="cal-bar whiwa" title="해역 초기화"></div>`;
    });
    state.bannerSchedule.forEach(b=>{
      if(b.start && isSameYMD(b.start,d)) html += `<div class="cal-chip">${escapeHtml(b.label||'픽업')}픽업</div>`;
      else if(b.end && isSameYMD(b.end,d)) html += `<div class="cal-bar" style="background:var(--auto);opacity:.5"></div>`;
    });
    return html;
  };

  const cellsHtml = cells.map(d=>{
    if(!d) return `<div class="cal-cell empty"></div>`;
    return `<div class="cal-cell"><div class="d">${d}</div>${markFor(d)}</div>`;
  }).join('');

  return `
    <div class="cal-nav">
      <button class="btn btn-small" id="cal-prev">◀</button>
      <span>${calYear}년 ${calMonth+1}월</span>
      <button class="btn btn-small" id="cal-next">▶</button>
    </div>
    <div class="cal-grid">${cellsHtml}</div>
    <div class="cal-legend">
      <span><span class="sw" style="background:var(--gold)"></span>역경의 탑 초기화</span>
      <span><span class="sw" style="background:#6ecff0"></span>해역 초기화</span>
      <span><span class="sw" style="background:var(--auto)"></span>픽업 시작</span>
    </div>
  `;
}
function isSameYMD(dateStr, d){
  if(!dateStr) return false;
  const dt = new Date(dateStr);
  return dt.getFullYear()===calYear && dt.getMonth()===calMonth && dt.getDate()===d;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const items = state.spendings.filter(x=>x.mode==='combined' && x.group===group);
  const rows = items.map(x=>`
    <tr data-id="${x.id}" class="${x.acquired?'row-acquired':''}">
      <td style="text-align:left;">${escapeHtml(x.label)}</td>
      <td><input type="text" inputmode="numeric" class="sp-c-star" placeholder="0" value="${numDisplay(x.star)}"></td>
      <td><input type="text" inputmode="numeric" class="sp-c-char" placeholder="0" value="${numDisplay(x.char)}"></td>
      <td><input type="text" inputmode="numeric" class="sp-c-weapon" placeholder="0" value="${numDisplay(x.weapon)}"></td>
      <td>
        <select class="sp-c-group">
          <option value="auto" ${x.group==='auto'?'selected':''}>자동분배</option>
          <option value="first" ${x.group==='first'?'selected':''}>전반부</option>
          <option value="second" ${x.group==='second'?'selected':''}>후반부</option>
          <option value="monthly" ${x.group==='monthly'?'selected':''}>월간패키지</option>
        </select>
      </td>
      <td><input type="checkbox" class="sp-c-toggle" ${x.acquired?'checked':''}></td>
    </tr>
  `).join('') || `<tr><td colspan="6" class="empty-hint">항목 없음</td></tr>`;
  const sub = groupSubtotal(group);
  return `<table><tr><th style="text-align:left;">항목</th><th>별</th><th>캐</th><th>무</th><th>그룹</th><th>습득</th></tr>${rows}</table>
  <div class="subtotal">소계: 별 <b>${sub.star.toLocaleString()}</b> · 캐 <b>${sub.char.toLocaleString()}</b> · 무 <b>${sub.weapon.toLocaleString()}</b></div>`;
}

function renderSpendingTab(){
  return `
    <div class="half-header first">전반부</div>
    <div class="card">
      ${renderSplitTable('first')}
      <div class="section-title">패스 등 (전반부 그룹)</div>
      ${renderGroupTable('first')}
    </div>

    <div class="half-header second">후반부</div>
    <div class="card">
      ${renderSplitTable('second')}
      <div class="section-title">후반부 그룹 항목</div>
      ${renderGroupTable('second')}
    </div>

    <div class="half-header auto">자동 분배</div>
    <div class="card">${renderGroupTable('auto')}</div>

    <div class="half-header monthly">월간 패키지</div>

/* =========================================================
   이벤트 바인딩
========================================================= */
function findById(arr, id){ return arr.find(x=>x.id===id); }

function bindTabEvents(){
  const main = document.getElementById('mainArea');

  if(activeTab === 'main'){
    main.querySelector('#cs-version').addEventListener('change', e=>{
      state.currentStatus.version = e.target.value;
      scheduleSave('currentStatus');
    });
    main.querySelector('#cs-half').addEventListener('change', e=>{
      state.currentStatus.half = e.target.value;
      scheduleSave('currentStatus');
    });
    ['star','char','weapon'].forEach(f=>{
      main.querySelector('#hold-'+f).addEventListener('input', e=>{
        state.holdings[f] = parseNum(e.target.value);
        scheduleSave('holdings');
        renderAll();
      });
    });
  }

  if(activeTab === 'schedule'){
    main.querySelector('#cal-prev').addEventListener('click', ()=>{
      calMonth--; if(calMonth<0){calMonth=11; calYear--;}
      renderAll();
    });
    main.querySelector('#cal-next').addEventListener('click', ()=>{
      calMonth++; if(calMonth>11){calMonth=0; calYear++;}
      renderAll();
    });
    main.querySelector('#b-add').addEventListener('click', ()=>{
      state.bannerSchedule.push({id:uid('ban'), label:'', start:'', end:'', half:'first'});
      scheduleSave('bannerSchedule');
      renderAll();
    });
    main.querySelectorAll('tr[data-id]').forEach(row=>{
      const id = row.dataset.id;
      const item = findById(state.bannerSchedule, id);
      if(!item) return;
      row.querySelector('.b-label').addEventListener('input', e=>{ item.label=e.target.value; scheduleSave('bannerSchedule'); });
      row.querySelector('.b-start').addEventListener('change', e=>{
        item.start = e.target.value;
        if(item.start){
          const d = new Date(item.start);
          d.setDate(d.getDate()+21);
          item.end = d.toISOString().slice(0,10);
        }
        scheduleSave('bannerSchedule');
        renderAll();
      });
      row.querySelector('.b-end').addEventListener('change', e=>{ item.end=e.target.value; scheduleSave('bannerSchedule'); });
      row.querySelector('.b-half').addEventListener('change', e=>{ item.half=e.target.value; scheduleSave('bannerSchedule'); });
      row.querySelector('.b-del').addEventListener('click', ()=>{
        state.bannerSchedule = state.bannerSchedule.filter(x=>x.id!==id);
        scheduleSave('bannerSchedule');
        renderAll();
      });
    });
  }

  if(activeTab === 'plan'){
    main.querySelector('#ver-add').addEventListener('click', ()=>{
      state.versions.push({id:uid('ver'), label:'새 버전', characters:[]});
      scheduleSave('versions');
      renderAll();
    });
    main.querySelectorAll('[data-vid]').forEach(vcard=>{
      const vid = vcard.dataset.vid;
      const ver = findById(state.versions, vid);
      if(!ver) return;
      vcard.querySelector('.v-label').addEventListener('input', e=>{ ver.label=e.target.value; scheduleSave('versions'); });
      vcard.querySelector('.v-del').addEventListener('click', ()=>{
        state.versions = state.versions.filter(x=>x.id!==vid);
        scheduleSave('versions');
        renderAll();
      });
      vcard.querySelector('.c-add').addEventListener('click', ()=>{
        ver.characters.push({id:uid('chr'), name:'', chain:0, hasWeapon:false, half:'first'});
        scheduleSave('versions');
        renderAll();
      });
      vcard.querySelectorAll('tr[data-cid]').forEach(row=>{
        const cid = row.dataset.cid;
        const c = findById(ver.characters, cid);
        if(!c) return;
        row.querySelector('.c-name').addEventListener('input', e=>{ c.name=e.target.value; scheduleSave('versions'); });
        row.querySelector('.c-chain').addEventListener('change', e=>{ c.chain=Number(e.target.value); scheduleSave('versions'); renderAll(); });
        row.querySelector('.c-weapon').addEventListener('change', e=>{ c.hasWeapon=e.target.checked; scheduleSave('versions'); renderAll(); });
        row.querySelector('.c-half').addEventListener('change', e=>{ c.half=e.target.value; scheduleSave('versions'); });
        row.querySelector('.c-del').addEventListener('click', ()=>{
          ver.characters = ver.characters.filter(x=>x.id!==cid);
          scheduleSave('versions');
          renderAll();
        });
      });
    });
  }

  if(activeTab === 'income'){
    main.querySelectorAll('.dw-toggle').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.dailyWeekly, row.dataset.id);
        item.acquired = e.target.checked;
        scheduleSave('dailyWeekly');
        renderAll();
      });
    });
    main.querySelectorAll('.mi-toggle').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.miscIncome, row.dataset.id);
        item.acquired = e.target.checked;
        scheduleSave('miscIncome');
        renderAll();
      });
    });
    main.querySelectorAll('.ev-add').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.eventIncome.push({id:uid('ev'), label:'', half:btn.dataset.half, star:0, char:0, weapon:0, acquired:false});
        scheduleSave('eventIncome');
        renderAll();
      });
    });
    main.querySelectorAll('#mainArea tr[data-id]').forEach(row=>{
      const item = findById(state.eventIncome, row.dataset.id);
      if(!item) return;
      const lbl = row.querySelector('.ev-label');
      if(lbl) lbl.addEventListener('input', e=>{ item.label=e.target.value; scheduleSave('eventIncome'); });
      const s = row.querySelector('.ev-star');
      if(s) s.addEventListener('input', e=>{ item.star=parseNum(e.target.value); scheduleSave('eventIncome'); renderAll(); });
      const c = row.querySelector('.ev-char');
      if(c) c.addEventListener('input', e=>{ item.char=parseNum(e.target.value); scheduleSave('eventIncome'); renderAll(); });
      const w = row.querySelector('.ev-weapon');
      if(w) w.addEventListener('input', e=>{ item.weapon=parseNum(e.target.value); scheduleSave('eventIncome'); renderAll(); });
      const mv = row.querySelector('.ev-move');
      if(mv) mv.addEventListener('click', ()=>{ item.half = item.half==='first'?'second':'first'; scheduleSave('eventIncome'); renderAll(); });
      const del = row.querySelector('.ev-del');
      if(del) del.addEventListener('click', ()=>{
        state.eventIncome = state.eventIncome.filter(x=>x.id!==item.id);
        scheduleSave('eventIncome');
        renderAll();
      });
    });
    const matrixToggle = main.querySelector('#matrix-toggle');
    if(matrixToggle){
      matrixToggle.addEventListener('change', e=>{
        const m = state.miscIncome.find(x=>x.group==='matrix');
        if(m){ m.acquired = e.target.checked; scheduleSave('miscIncome'); renderAll(); }
      });
    }
    const resetBtn = main.querySelector('#income-reset');
    resetBtn.addEventListener('click', ()=>{
      armedClick(resetBtn, '수급설정 기본값으로 초기화', ()=>{
        state.dailyWeekly = defaultDailyWeekly();
        state.miscIncome = defaultMiscIncome();
        state.eventIncome = defaultEventIncome();
        scheduleSave('dailyWeekly'); scheduleSave('miscIncome'); scheduleSave('eventIncome');
        showToast('수급 설정을 기본값으로 되돌렸습니다');
        renderAll();
      });
    });
  }

  if(activeTab === 'spending'){
    main.querySelectorAll('.sp-star,.sp-char,.sp-weapon').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.spendings, row.dataset.id);
        const half = e.target.dataset.half;
        const field = e.target.classList.contains('sp-star') ? 'Star' : (e.target.classList.contains('sp-char') ? 'Char' : 'Weapon');
        item[half+field] = parseNum(e.target.value);
        scheduleSave('spendings');
        renderAll();
      });
    });
    main.querySelectorAll('.sp-toggle').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.spendings, row.dataset.id);
        item.acquired = e.target.checked;
        scheduleSave('spendings');
        renderAll();
      });
    });
    main.querySelectorAll('.sp-c-star,.sp-c-char,.sp-c-weapon').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.spendings, row.dataset.id);
        const field = e.target.classList.contains('sp-c-star') ? 'star' : (e.target.classList.contains('sp-c-char') ? 'char' : 'weapon');
        item[field] = parseNum(e.target.value);
        scheduleSave('spendings');
        renderAll();
      });
    });
    main.querySelectorAll('.sp-c-group').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.spendings, row.dataset.id);
        item.group = e.target.value;
        scheduleSave('spendings');
        renderAll();
      });
    });
    main.querySelectorAll('.sp-c-toggle').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const row = e.target.closest('tr');
        const item = findById(state.spendings, row.dataset.id);
        item.acquired = e.target.checked;
        scheduleSave('spendings');
        renderAll();
      });
    });
    const resetBtn = main.querySelector('#spending-reset');
    resetBtn.addEventListener('click', ()=>{
      armedClick(resetBtn, '과금내역 기본값으로 초기화', ()=>{
        state.spendings = defaultSpendings();
        scheduleSave('spendings');
        showToast('과금 내역을 기본값으로 되돌렸습니다');
        renderAll();
      });
    });
  }
}

/* =========================================================
   일정 API 연동 (best-effort, 실패해도 폴백 유지)
========================================================= */
function parseSeasonResponse(json){
  // 역경의 탑: { seasons: [{id, name, areas, start, finish, current}] }
  // 해역:      [ {Season, Name, start, finish, current} ]  (최상위가 배열, 필드명 대문자 Season/Name)
  const arr = (json && Array.isArray(json.seasons)) ? json.seasons : (Array.isArray(json) ? json : null);
  if(!Array.isArray(arr)) return null;
  const out = arr
    .filter(item => item && item.start)
    .map(item => ({
      id: String(item.id != null ? item.id : item.Season),
      start: item.start,
      finish: item.finish || null,
      current: !!item.current,
    }));
  return out.length ? out : null;
}
async function fetchOne(urls){
  for(const url of urls){
    try{
      const res = await fetch(url);
      if(!res.ok) continue;
      const json = await res.json();
      const parsed = parseSeasonResponse(json);
      if(parsed && parsed.length) return parsed;
    }catch(e){ /* 다음 URL 시도 */ }
  }
  return null;
}
async function fetchScheduleData(){
  const statusEl = ()=>document.getElementById('fetchStatus');
  try{
    const [toa, whiwa] = await Promise.all([
      fetchOne(['https://api-v2.encore.moe/api/ko/toa','https://api.encore.moe/ko/toa']),
      fetchOne(['https://api-v2.encore.moe/api/ko/whiwa','https://api.encore.moe/ko/whiwa']),
    ]);
    if(toa) state.toaSeasons = toa;
    if(whiwa) state.whiwaSeasons = whiwa;
    if(activeTab === 'schedule'){
      const el = statusEl();
      if(el) el.textContent = (toa||whiwa)
        ? 'encore.moe API에서 시즌 데이터를 불러왔습니다.'
        : 'API 응답을 해석하지 못했습니다 — 실제 응답 스키마 확인 필요(현재 폴백 데이터 없음, 픽업 일정은 수동 관리).';
      renderAll();
    }
  }catch(e){
    if(activeTab === 'schedule'){
      const el = statusEl();
      if(el) el.textContent = 'API 호출 실패 — 네트워크/CORS 확인 필요(현재 폴백 데이터 없음, 픽업 일정은 수동 관리).';
    }
  }
}

(async function init(){
  await loadAll();
