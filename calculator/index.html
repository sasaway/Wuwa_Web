<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명조 스킬 재화 계산기</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --border:#2a3350;
    --text:#e8e6df; --muted:#8b93a7; --gold:#d4af6a; --gold-dim:#a68a52;
    --danger:#d9534f; --danger-dim:#8a3a37;
    --t-green:#4fae7a; --t-blue:#4a90d9; --t-purple:#9b6fd1; --t-gold:#d4af6a;
    --e-glacio:#7ec8e3; --e-fusion:#e0703e; --e-electro:#a56fe0;
    --e-aero:#5cbf8e; --e-spectro:#d9c15a; --e-havoc:#d968a0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;padding-bottom:20px;}
  header{max-width:960px;margin:0 auto;padding:16px 16px 0;}
  h1{font-size:18px;color:var(--gold);margin:0 0 12px;font-weight:700;}
  main{max-width:960px;margin:0 auto;padding:0 16px 16px;}
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  nav.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--text);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 8px;font-size:13px;}
  select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:5px 7px;font-size:12.5px;}
  button.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;}
  button.btn:hover{border-color:var(--gold-dim);}
  button.btn-gold{background:var(--gold);color:#1a1608;border:none;font-weight:700;}
  button.btn-danger{background:var(--danger-dim);border:1px solid var(--danger);color:#fff;}
  button.btn-small{padding:3px 8px;font-size:11px;}
  button.tglbtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  button.tglbtn.active{color:var(--gold);border-color:var(--gold-dim);}

  .group-block{margin-bottom:14px;}
  .group-title{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .pill-wrap{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    border:1px solid var(--border);border-left:4px solid var(--pc,var(--gold));
    background:var(--panel2);color:var(--text);border-radius:5px;
    padding:5px 10px;font-size:12px;cursor:pointer;
  }
  .pill:hover{border-color:var(--gold-dim);}
  .pill.added{opacity:0.4;cursor:default;}

  .totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .tstat{background:var(--panel2);border-radius:6px;padding:10px;text-align:center;}
  .tstat .n{font-size:19px;font-weight:700;}
  .tstat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .tstat.green .n{color:var(--t-green);}
  .tstat.blue .n{color:var(--t-blue);}
  .tstat.purple .n{color:var(--t-purple);}
  .tstat.gold .n{color:var(--t-gold);}

  .trainee-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel2);}
  .trainee-card.inactive{opacity:0.45;}
  .trainee-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .trainee-name{font-weight:700;font-size:14px;}
  .trainee-tags{font-size:11px;color:var(--muted);margin-left:6px;}
  .skill-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
  @media (max-width:640px){.skill-grid{grid-template-columns:repeat(2,1fr);}}
  .skill-cell{background:var(--panel);border-radius:5px;padding:6px;text-align:center;}
  .skill-cell label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px;}
  .sub-line{font-size:11.5px;color:var(--muted);text-align:right;}
  .sub-line b{color:var(--gold);}
  .foot-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  label.toggle{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;}

  .settings-body{display:none;}
  .settings-body.open{display:block;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:6px;text-align:center;border-bottom:1px solid var(--border);}
  th{color:var(--muted);}
  td input[type=text]{width:60px;text-align:center;}

  .party-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--panel2);}
  .party-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .party-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .slot{background:var(--panel);border:1px dashed var(--border);border-radius:6px;padding:10px;text-align:center;}
  .slot .name{font-weight:600;font-size:13px;margin-bottom:4px;}
  .slot .empty{color:var(--muted);font-size:12px;}
  .slot select{width:100%;margin-top:4px;}

  .empty-hint{color:var(--muted);font-size:12px;padding:10px 0;}
  .note{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--gold-dim);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>명조 스킬 재화 계산기 — 프로토타입 v1</h1>
  <nav class="tabs" id="tabNav"></nav>
</header>
<main id="mainArea"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   저장 어댑터 (window.storage 없으면 localStorage로 자동 폴백)
========================================================= */
const hasArtifactStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const storageAdapter = hasArtifactStorage ? {
  get: (key) => window.storage.get(key, false),
  set: (key, value) => window.storage.set(key, value, false),
} : {
  get: async (key) => {
    const v = localStorage.getItem('wuwa_calc_' + key);
    return v == null ? null : {value: v};
  },
  set: async (key, value) => {
    localStorage.setItem('wuwa_calc_' + key, value);
    return {value};
  },
};

/* =========================================================
   로스터 (58명 — element/weapon type은 공개 캐릭터 DB 기준으로 검증.
   name은 encore.moe(ko/en 로케일 대조)로 확인한 한국어 공식 표기로 교체함(2026-09-18).
   position은 커뮤니티에 널리 알려진 통상적 포지션 기본값 — 계산기 UI에서 캐릭터별로 수정 가능) */
const ROSTER = [

  {name:'유호', element:'응결', weapon:'권갑', position:'힐러/서포터'},
  {name:'카를로타', element:'응결', weapon:'권총', position:'메인딜러'},
  {name:'루실라', element:'응결', weapon:'증폭기', position:'서브딜러'},
  {name:'히유키', element:'응결', weapon:'직검', position:'서브딜러'},
  {name:'수수', element:'응결', weapon:'증폭기', position:'힐러/서포터'},
  {name:'치샤', element:'용융', weapon:'권총', position:'메인딜러'},
  {name:'앙코', element:'용융', weapon:'증폭기', position:'메인딜러'},
  {name:'모르테피', element:'용융', weapon:'권총', position:'서브딜러'},
  {name:'장리', element:'용융', weapon:'직검', position:'메인딜러'},
  {name:'브렌트', element:'용융', weapon:'직검', position:'서브딜러'},
  {name:'루파', element:'용융', weapon:'대검', position:'메인딜러'},
  {name:'갈브레나', element:'용융', weapon:'권총', position:'서브딜러'},
  {name:'모니에', element:'용융', weapon:'대검', position:'메인딜러'},
  {name:'에이메스', element:'용융', weapon:'직검', position:'서브딜러'},
  {name:'데니아', element:'용융', weapon:'증폭기', position:'힐러/서포터'},
  {name:'경연', element:'용융', weapon:'대검', position:'메인딜러'},
  {name:'카카루', element:'전도', weapon:'대검', position:'메인딜러'},
  {name:'음림', element:'전도', weapon:'증폭기', position:'서브딜러'},
  {name:'연무', element:'전도', weapon:'권갑', position:'서브딜러'},
  {name:'상리요', element:'전도', weapon:'권갑', position:'메인딜러'},
  {name:'루미', element:'전도', weapon:'대검', position:'메인딜러'},
  {name:'아우구스타', element:'전도', weapon:'대검', position:'서브딜러'},
  {name:'복링', element:'전도', weapon:'증폭기', position:'서브딜러'},
  {name:'레베카', element:'전도', weapon:'권총', position:'서브딜러'},
  {name:'방랑자(전도)', element:'전도', weapon:'직검', position:'메인딜러'},
  {name:'양양', element:'기류', weapon:'직검', position:'서브딜러'},
  {name:'알토', element:'기류', weapon:'권총', position:'서브딜러'},
  {name:'기염', element:'기류', weapon:'대검', position:'메인딜러'},
  {name:'감심', element:'기류', weapon:'권갑', position:'힐러/서포터'},
  {name:'샤콘', element:'기류', weapon:'권총', position:'서브딜러'},
  {name:'방랑자(기류)', element:'기류', weapon:'직검', position:'메인딜러'},
  {name:'카르티시아', element:'기류', weapon:'직검', position:'메인딜러'},
  {name:'유노', element:'기류', weapon:'권갑', position:'힐러/서포터'},
  {name:'구원', element:'기류', weapon:'직검', position:'서브딜러'},
  {name:'시그리카', element:'기류', weapon:'권갑', position:'서브딜러'},
  {name:'청초', element:'기류', weapon:'직검', position:'메인딜러'},

  {name:'방랑자(회절)', element:'회절', weapon:'직검', position:'메인딜러'},
  {name:'금희', element:'회절', weapon:'대검', position:'메인딜러'},
  {name:'파수인', element:'회절', weapon:'증폭기', position:'힐러/서포터'},
  {name:'페비', element:'회절', weapon:'증폭기', position:'서브딜러'},
  {name:'젠니', element:'회절', weapon:'권갑', position:'메인딜러'},
  {name:'린네', element:'회절', weapon:'권총', position:'서브딜러'},
  {name:'루크·헤르센', element:'회절', weapon:'권갑', position:'서브딜러'},
  {name:'루시', element:'회절', weapon:'권총', position:'힐러/서포터'},
  {name:'도기', element:'인멸', weapon:'대검', position:'서브딜러'},
  {name:'단근', element:'인멸', weapon:'직검', position:'서브딜러'},
  {name:'카멜리아', element:'인멸', weapon:'직검', position:'메인딜러'},
  {name:'방랑자(인멸)', element:'인멸', weapon:'직검', position:'메인딜러'},
  {name:'로코코', element:'인멸', weapon:'권갑', position:'서브딜러'},
  {name:'칸타렐라', element:'인멸', weapon:'증폭기', position:'메인딜러'},
  {name:'플로로', element:'인멸', weapon:'증폭기', position:'메인딜러'},
  {name:'치사', element:'인멸', weapon:'대검', position:'서브딜러'},
  {name:'양양(현령)', element:'인멸', weapon:'직검', position:'서브딜러'},
].map((c,i)=>({id:'r'+(i+1), ...c}));

const POSITIONS = ['메인딜러','서브딜러','힐러/서포터'];

const ELEMENTS = ['응결','용융','전도','기류','회절','인멸'];
const WEAPONS = ['대검','직검','권총','권갑','증폭기'];
const ELEMENT_COLOR = {응결:'var(--e-glacio)', 용융:'var(--e-fusion)', 전도:'var(--e-electro)', 기류:'var(--e-aero)', 회절:'var(--e-spectro)', 인멸:'var(--e-havoc)'};
const SKILL_DEFS = [
  {key:'basic', label:'기본공격'},
  {key:'skill', label:'공명스킬'},
  {key:'circuit', label:'공명회로'},
  {key:'liberation', label:'공명해방'},
  {key:'intro', label:'변주스킬'},
];

/* =========================================================
   기본값 / 상태
========================================================= */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function defaultSettings(){
  return { green:5, blue:5, to6purple:3, to10purple:3, to10gold:6, includeSixInTen:true, treeBlue:3, treePurple:15, treeGold:12 };
}
function defaultTrainees(){ return []; }
function defaultParties(){ return []; }

let state = { trainees: defaultTrainees(), parties: defaultParties(), settings: defaultSettings() };
const STORAGE_KEYS = ['trainees','parties','settings'];
const saveTimers = {};

/* 저장된 데이터의 스키마가 나중에 바뀌어도(예: trainee에 position 필드 추가) 깨지지 않도록
   로드 직후 한 번 보정. 가챠 플래너의 normalize() 패턴과 동일한 역할. */
function normalize(key, value){
  if(value == null) return value;
  if(key === 'trainees'){
    return value.map(t=> ({position:'unset', ...t}));
  }
  return value;
}

async function loadAll(){
  for(const key of STORAGE_KEYS){
    try{
      const res = await storageAdapter.get(key);
      if(res && typeof res.value === 'string') state[key] = normalize(key, JSON.parse(res.value));
    }catch(e){ /* 기본값 유지 */ }
  }
}
function scheduleSave(key){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await storageAdapter.set(key, JSON.stringify(state[key])); }
    catch(e){ showToast('저장 실패: '+key); }
  }, 500);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function numDisplay(n){ return (!n) ? '' : String(n); }
function parseNum(v){ const n = parseInt(v,10); return isNaN(n) ? 0 : n; }
function armedClick(btn, originalLabel, onConfirm){
  if(btn.dataset.armed === '1'){
    clearTimeout(Number(btn.dataset.timer));
    btn.dataset.armed='0'; btn.textContent = originalLabel;
    onConfirm();
  }else{
    btn.dataset.armed='1'; btn.textContent='한번 더 클릭';
    const t = setTimeout(()=>{ btn.dataset.armed='0'; btn.textContent=originalLabel; }, 4000);
    btn.dataset.timer = String(t);
  }
}

/* =========================================================
   계산 로직
========================================================= */
function zeroCost(){ return {green:0,blue:0,purple:0,gold:0}; }
function addCost(a,b){ return {green:a.green+b.green, blue:a.blue+b.blue, purple:a.purple+b.purple, gold:a.gold+b.gold}; }
function skillCost(level, s){
  if(level !== '6' && level !== '10') return zeroCost();
  const c = {green:s.green, blue:s.blue, purple:0, gold:0};
  if(level==='6'){ c.purple += s.to6purple; }
  else{
    c.purple += s.to10purple;
    if(s.includeSixInTen) c.purple += s.to6purple;
    c.gold += s.to10gold;
  }
  return c;
}
function traineeSubtotal(tr, s){
  let total = zeroCost();
  SKILL_DEFS.forEach(sd=> total = addCost(total, skillCost(tr.skills[sd.key], s)));
  if(tr.fillAll){ total.blue += s.treeBlue; total.purple += s.treePurple; total.gold += s.treeGold; }
  return total;
}
function grandTotal(){
  let total = zeroCost();
  state.trainees.filter(t=>t.active).forEach(t=> total = addCost(total, traineeSubtotal(t, state.settings)));
  return total;
}

/* =========================================================
   탭 라우팅
========================================================= */
const TABS = [{id:'train', label:'캐릭터 육성'}, {id:'party', label:'육성 파티'}];
let activeTab = 'train';
let groupMode = 'element'; // 'element' | 'weapon'
let searchQuery = '';
let settingsOpen = false;

function renderNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===activeTab?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; renderAll(); }));
}
function renderAll(){
  renderNav();
  const m = document.getElementById('mainArea');
  m.innerHTML = activeTab==='train' ? renderTrainTab() : renderPartyTab();
  bindEvents();
}

/* =========================================================
   캐릭터 육성 탭
========================================================= */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderRosterPanel(){
  const q = searchQuery.trim().toLowerCase();
  const addedIds = new Set(state.trainees.map(t=>t.rosterId));
  const filtered = ROSTER.filter(c=> !q || c.name.toLowerCase().includes(q));
  const keys = groupMode==='element' ? ELEMENTS : WEAPONS;

  const groups = keys.map(key=>{
    const items = filtered.filter(c=> (groupMode==='element' ? c.element : c.weapon) === key);
    if(!items.length) return '';
    const pills = items.map(c=>{
      const added = addedIds.has(c.id);
      return `<span class="pill ${added?'added':''}" data-rid="${c.id}" style="--pc:${ELEMENT_COLOR[c.element]}">${escapeHtml(c.name)}${added?' ✓':''}</span>`;
    }).join('');
    return `<div class="group-block"><div class="group-title">${key} (${items.length})</div><div class="pill-wrap">${pills}</div></div>`;
  }).join('');

  return `
    <div class="card">
      <h2>캐릭터 추가</h2>
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="이름 검색" value="${escapeHtml(searchQuery)}">
        <button class="tglbtn ${groupMode==='element'?'active':''}" id="grp-element">속성별</button>
        <button class="tglbtn ${groupMode==='weapon'?'active':''}" id="grp-weapon">무기별</button>
      </div>
      ${groups || '<div class="empty-hint">검색 결과가 없습니다</div>'}
      <div class="note">클릭하면 아래 육성 목록에 추가됩니다. (로스터 58명 · 포지션 기본값은 편집 가능한 참고용입니다)</div>
    </div>
  `;
}

function renderSettingsPanel(){
  const s = state.settings;
  return `
    <div class="card">
      <div class="toolbar" style="justify-content:space-between;">
        <h2 style="margin:0;">소모량 설정</h2>

/* =========================================================
   포지션/속성 시너지 기반 팀 추천 (재화 계산과는 무관한 참고용 휴리스틱)
========================================================= */
function recommendParties(){
  const pool = state.trainees;
  const mains = pool.filter(t=>t.position==='메인딜러');
  const subs = pool.filter(t=>t.position==='서브딜러');
  const heals = pool.filter(t=>t.position==='힐러/서포터');
  const missing = [];
  if(!mains.length) missing.push('메인딜러');
  if(!subs.length) missing.push('서브딜러');
  if(!heals.length) missing.push('힐러/서포터');
  if(missing.length) return {combos:[], missing};

  const combos = [];
  mains.forEach(m=>{
    subs.forEach(s=>{
      if(s.id===m.id) return;
      heals.forEach(h=>{
        if(h.id===m.id || h.id===s.id) return;
        const members = [m,s,h];
        const counts = {};
        members.forEach(x=> counts[x.element] = (counts[x.element]||0)+1);
        const synergy = Math.max(...Object.values(counts)) >= 2;
        combos.push({members, synergy});
      });
    });
  });
  combos.sort((a,b)=> (b.synergy?1:0) - (a.synergy?1:0));
  return {combos: combos.slice(0,5), missing:[]};
}

function renderRecommendPanel(){
  const {combos, missing} = recommendParties();
  if(missing.length){
    return `
      <div class="card">
        <h2>추천 조합</h2>
        <div class="empty-hint">${missing.join(', ')} 포지션의 캐릭터가 육성 목록에 없어 추천할 수 없습니다. "캐릭터 육성" 탭에서 포지션을 지정해주세요.</div>
      </div>
    `;
  }
  const cardsHtml = combos.map((c,i)=>`
    <div class="party-card">
      <div class="party-head">
        <div style="font-weight:700;">추천 조합 ${i+1}${c.synergy ? ' <span class="note" style="display:inline;color:var(--gold);">· 속성 시너지</span>' : ''}</div>
        <button class="btn btn-small btn-gold combo-use" data-combo="${i}">이 조합으로 파티 만들기</button>
      </div>
      <div class="party-slots">
        ${c.members.map(m=>`<div class="slot"><div class="name">${escapeHtml(m.name)}</div><div class="note" style="margin:0;">${m.position} · ${m.element}</div></div>`).join('')}
      </div>
    </div>
  `).join('');
  return `
    <div class="card">
      <h2>추천 조합</h2>
      <div class="note" style="margin-bottom:10px;">메인딜러·서브딜러·힐러/서포터를 1명씩 묶어 추천합니다. "속성 시너지"는 같은 속성이 2명 이상 겹칠 때 표시되는 단순 참고용 표시이며, 실제 공명 효과를 계산하지는 않습니다.</div>
      ${cardsHtml}
    </div>
  `;
}

/* =========================================================
   육성 파티 탭 (재화 소계 없음, 3인 고정 그룹핑 전용)
========================================================= */
function renderPartySlot(party, slotIndex){
  const assignedId = party.slots[slotIndex];
  const assigned = assignedId ? state.trainees.find(t=>t.id===assignedId) : null;
  const optionsHtml = ['<option value="">비어있음</option>']
    .concat(state.trainees.map(t=>`<option value="${t.id}" ${assignedId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`))
    .join('');
  return `
    <div class="slot" data-pid="${party.id}" data-slot="${slotIndex}">
      ${assigned ? `<div class="name">${escapeHtml(assigned.name)}</div><div class="note" style="margin:0;">${assigned.element} · ${assigned.weapon}</div>` : `<div class="empty">비어있음</div>`}
      <select class="slot-select">${optionsHtml}</select>
    </div>
  `;
}
function renderPartyCard(party){
  return `
    <div class="party-card" data-id="${party.id}">
      <div class="party-head">
        <input type="text" class="party-name" value="${escapeHtml(party.name)}" style="font-weight:700;">
        <button class="btn btn-small btn-danger p-del">삭제</button>
      </div>
      <div class="party-slots">
        ${[0,1,2].map(i=>renderPartySlot(party,i)).join('')}
      </div>
    </div>
  `;
}
function renderPartyTab(){
  return `
    ${renderRecommendPanel()}
    <div class="note" style="margin-bottom:10px;">
      파티는 재화 계산과 무관하게, 육성 목록에 추가된 캐릭터를 3인 조합으로 정리해두는 용도입니다. 한 캐릭터가 여러 파티에 동시에 들어갈 수 있습니다.
    </div>
    ${state.parties.length ? state.parties.map(renderPartyCard).join('') : '<div class="empty-hint">아직 만든 파티가 없습니다.</div>'}
    <button class="btn btn-gold" id="party-add">+ 파티 추가</button>
  `;
}

/* =========================================================
   이벤트 바인딩
========================================================= */
function findTrainee(id){ return state.trainees.find(t=>t.id===id); }

function bindEvents(){
  const main = document.getElementById('mainArea');

  if(activeTab === 'train'){
    const search = main.querySelector('#searchInput');
    if(search) search.addEventListener('input', e=>{ searchQuery = e.target.value; renderAll(); });
    const grpEl = main.querySelector('#grp-element');
    if(grpEl) grpEl.addEventListener('click', ()=>{ groupMode='element'; renderAll(); });
    const grpWp = main.querySelector('#grp-weapon');
    if(grpWp) grpWp.addEventListener('click', ()=>{ groupMode='weapon'; renderAll(); });

    main.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        const rid = p.dataset.rid;
        if(state.trainees.some(t=>t.rosterId===rid)){ showToast('이미 추가된 캐릭터입니다'); return; }
        const c = ROSTER.find(x=>x.id===rid);
        state.trainees.push({
          id: uid('tr'), rosterId: c.id, name: c.name, element: c.element, weapon: c.weapon, position: c.position,
          active: true, fillAll: false,
          skills: {basic:'none', skill:'none', circuit:'none', liberation:'none', intro:'none'},
        });
        scheduleSave('trainees');
        renderAll();
      });
    });

    const settingsToggle = main.querySelector('#settings-toggle');
    if(settingsToggle) settingsToggle.addEventListener('click', ()=>{ settingsOpen = !settingsOpen; renderAll(); });

    const sFieldMap = {
      's-green':'green','s-blue':'blue','s-to6purple':'to6purple','s-to10purple':'to10purple',
      's-to10gold':'to10gold','s-treeBlue':'treeBlue','s-treePurple':'treePurple','s-treeGold':'treeGold',
    };
    Object.keys(sFieldMap).forEach(id=>{
      const el = main.querySelector('#'+id);
      if(el) el.addEventListener('input', e=>{
        state.settings[sFieldMap[id]] = parseNum(e.target.value);
        scheduleSave('settings');
        renderAll();
      });
    });
    const includeSix = main.querySelector('#s-includeSix');
    if(includeSix) includeSix.addEventListener('change', e=>{
      state.settings.includeSixInTen = e.target.checked;
      scheduleSave('settings');
      renderAll();
    });

    main.querySelectorAll('.trainee-card').forEach(card=>{
      const id = card.dataset.id;
      const tr = findTrainee(id);
      if(!tr) return;
      card.querySelector('.tr-active').addEventListener('change', e=>{ tr.active=e.target.checked; scheduleSave('trainees'); renderAll(); });
      card.querySelector('.tr-fillall').addEventListener('change', e=>{ tr.fillAll=e.target.checked; scheduleSave('trainees'); renderAll(); });
      card.querySelector('.tr-position').addEventListener('change', e=>{ tr.position=e.target.value; scheduleSave('trainees'); renderAll(); });
      card.querySelectorAll('.skill-select').forEach(sel=>{
        sel.addEventListener('change', e=>{
          tr.skills[sel.dataset.key] = e.target.value;
          scheduleSave('trainees');
          renderAll();
        });
      });
      const delBtn = card.querySelector('.tr-del');
      delBtn.addEventListener('click', ()=>{
        armedClick(delBtn, '삭제', ()=>{
          state.trainees = state.trainees.filter(x=>x.id!==id);
          state.parties.forEach(p=>{ p.slots = p.slots.map(s=> s===id ? null : s); });
          scheduleSave('trainees'); scheduleSave('parties');
          showToast('삭제되었습니다');
          renderAll();
        });
      });
    });

    const exportBtn = main.querySelector('#export-btn');
    if(exportBtn) exportBtn.addEventListener('click', ()=>{
      const data = JSON.stringify({trainees:state.trainees, parties:state.parties, settings:state.settings}, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'wuwa_calculator_data.json';
      a.click();
      URL.revokeObjectURL(url);
    });
    const importBtn = main.querySelector('#import-btn');
    const importFile = main.querySelector('#import-file');
    if(importBtn) importBtn.addEventListener('click', ()=> importFile.click());
    if(importFile) importFile.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(parsed.trainees) state.trainees = normalize('trainees', parsed.trainees);
          if(parsed.parties) state.parties = parsed.parties;
          if(parsed.settings) state.settings = parsed.settings;
          STORAGE_KEYS.forEach(scheduleSave);
          showToast('불러오기 완료');
          renderAll();
        }catch(err){ showToast('JSON 파일을 읽지 못했습니다'); }
      };
      reader.readAsText(file);
    });
  }

  if(activeTab === 'party'){
    const {combos} = recommendParties();
    main.querySelectorAll('.combo-use').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const combo = combos[Number(btn.dataset.combo)];
        if(!combo) return;
        state.parties.push({id:uid('party'), name:'추천 조합', slots:combo.members.map(m=>m.id)});
        scheduleSave('parties');
        showToast('파티가 생성되었습니다');
        renderAll();
      });
    });

    const addBtn = main.querySelector('#party-add');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      state.parties.push({id:uid('party'), name:'새 파티', slots:[null,null,null]});
      scheduleSave('parties');
      renderAll();
    });
    main.querySelectorAll('.party-card').forEach(card=>{
      const pid = card.dataset.id;
      const party = state.parties.find(p=>p.id===pid);
      if(!party) return;
      card.querySelector('.party-name').addEventListener('input', e=>{ party.name=e.target.value; scheduleSave('parties'); });
      const delBtn = card.querySelector('.p-del');
      delBtn.addEventListener('click', ()=>{
        armedClick(delBtn, '삭제', ()=>{
          state.parties = state.parties.filter(x=>x.id!==pid);
          scheduleSave('parties');
          showToast('파티가 삭제되었습니다');
          renderAll();
        });
      });
      card.querySelectorAll('.slot').forEach(slotEl=>{
        const idx = Number(slotEl.dataset.slot);
        slotEl.querySelector('.slot-select').addEventListener('change', e=>{
          party.slots[idx] = e.target.value || null;
          scheduleSave('parties');
          renderAll();
        });
      });
    });
  }
}

  await loadAll();
  renderAll();
